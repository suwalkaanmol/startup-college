# Render Blueprint for UniHub: dashboard.render.com > New > Blueprint > this repo (file: hub/render.yaml).
# Free plan: the server sleeps after 15 minutes without visitors and wakes in about a minute.
# Data lives in PostgreSQL (DATABASE_URL, e.g. a free Neon database), so nothing is lost on restarts or redeploys.
# Every push to the branch below redeploys the site automatically.
services:
  - type: web
    name: unihub
    runtime: node
    plan: free
    branch: feature/hub
    buildCommand: echo "UniHub has no build step"
    startCommand: node hub/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false          # Neon connection string: postgresql://user:password@ep-....neon.tech/neondb?sslmode=require
      - key: ADMIN_PASSWORD
        sync: false          # your admin login's password (8+ characters, letters and numbers)
      - key: BREVO_API_KEY
        sync: false          # Brevo > SMTP & API > API keys (Render's free plan blocks SMTP, so email goes over Brevo's API)
      - key: MAIL_FROM
        sync: false          # e.g. UniHub <your-verified-sender@gmail.com>
