# Render Blueprint for UniHub. New > Blueprint > pick this repo, path hub/render.yaml
services:
  - type: web
    name: unihub
    runtime: node
    plan: starter            # a paid plan keeps the disk below; free plans lose data on restart
    buildCommand: echo "no build step"
    startCommand: node hub/server.js
    healthCheckPath: /api/health
    disk:
      name: unihub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/hub.json
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # the admin login's password (8+ chars, letters and numbers)
      - key: SMTP_URL
        sync: false          # e.g. smtps://you%40gmail.com:APP_PASSWORD@smtp.gmail.com:465
      - key: MAIL_FROM
        sync: false
